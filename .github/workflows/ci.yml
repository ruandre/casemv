name: CI

# Pull requests are disabled on the repository, so only pushes to main run CI.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install exactly what mise.lock records (checksums included).
  MISE_LOCKED: 1
  # Pins mise itself. The action verifies it against the release's signed
  # packslip; a sha256 input would replace that check.
  MISE_VERSION: 2026.11.4

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run check
      - run: mise run vet-cross
      - run: mise run vuln

  test:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run test-race
      - run: mise run test-e2e

  # Unit tests only: e2e uses Unix signals and bash/fish completion, and the
  # mise test tasks are bash scripts.
  test-other-os:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go
      - run: go test -count=1 ./...
