name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install exactly what mise.lock records (checksums included).
  MISE_LOCKED: 1
  # Pins mise itself; downloads are checked against its signed checksums, which a sha256 input would disable.
  MISE_VERSION: 2026.10.19

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run check
      - run: mise run vet-cross
      - run: mise run vuln

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run test-race
      - run: mise run test-e2e
